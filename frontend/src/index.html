<!DOCTYPE html>
<html>
<head>
    <title>System Agent Core</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components/chat/chat.css">
</head>

<body>

    <!-------- TITLEBAR -------->
    <div class="titlebar">
        <!-- Titlebar content -->
        <div class="titlebar_content">
            <!-- connection status -->
            <div class="conection_status connecting" id="connection_status">
                <p id="connection_status_text">connecting...</p>
                <div class="conection_status_tooltip">
                <p id="tooltip_llm_container" class="connecting">llm: <span id="tooltip_llm">not connected</span></p>
                <p id="tooltip_tts_container" class="connecting">tts: <span id="tooltip_tts">not connected</span></p>
                <p id="tooltip_ww_container" class="connecting">ww: <span id="tooltip_ww">not connected</span></p>
                </div>
            </div>

            <!-- basic Tools -->
            <div class="basic_tools">
                <button id="tools_toggle"><img src="../assets/images/arrow.png" id="tools_arrow"></button>
                <button id="settings_panel"><img src="../assets/images/settings2.webp"></button>
                <button id="agent_settings_panel"><img src="../assets/images/ai_sphere.png"></button>
            </div>
            
            <!-- toggle chat -->
            <div class="toggle_chat"></div>
        
        </div>
        <!-- close app -->
        <button id="close_app_btn"></button>
    </div>

    <!--------  PRINCIPAL INTERFACE --------->
    <div class="principal_content">
        <div class="sphere_wrapper">
            <div id="sphere_container"></div>
        </div>
    </div>

    <!-------- CHAT -------->
    <div class="chat_main_container" id="chat_main_container">
        <!-- conversation selector (pending to apply) -->
        <div class="chat_conversation_selector" id="chat_conversation_selector"></div>
        <!-- chat messages container -->
        <div class="chat_messages_main_container" id="chat_messages_main_container">
            <div class="chat_messages_container" id="chat_messages_container"></div>
            <div class="chat_input_container">
                <input type="text" id="chat_input" placeholder="Type your message...">
                <button id="send_message_btn">Send</button>
            </div>
        </div>

    </div>

    <!-------- NAVBAR -------->
    <!-- Controlls Views -->
    <div class="navbar_container">
        <div class="navbar_marker">
            <div class="navbar_marker_arrow">
                <div class="arrow_left"></div>
                <div class="arrow_right"></div>
            </div>
        </div>
        <div class="navbar" id="navbar">
            <button id="btn1"></button>
            <button id="btn2"></button>
            <button id="open_chat_btn" class="open_chat_btn"><img class="open_chat_icon" src="../assets/images/open_chat.png"></button>
            <button id="home_btn"><img class="open_chat_icon" src="../assets/images/ai_sphere.png"></button>
            <button id="btn5"></button>
            <button id="btn6"></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="components/sphere/sphere-ion.js"></script>
    <script src="components/sphere/sphere-rings.js"></script>
    
    <script src="components/sphere/sphere-themes.js"></script>
    <script src="components/background/bg-themes.js"></script>
    <script src="components/background/grainy-bg.js"></script>
    <script src="components/chat/chat_renderer.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
